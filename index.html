<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday 💗</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stars"></div>

    <main>
        <div class="card">

            <p class="small-title">✨ A SPECIAL DAY ✨</p>

            <div class="cake">🎂</div>

            <h1>
                Happy<br>
                <span>Birthday!</span>
            </h1>

            <div class="line"></div>

            <p id="typing"></p>

            <button onclick="openGift()">
                🎁 Open Your Gift
            </button>

            <div id="gift" class="gift">
                <h2>💌 For You</h2>

                <p>
                    Selamat ulang tahun! 🥳
                    Semoga di usia yang baru ini,
                    semua hal baik datang kepadamu.
                </p>

                <p>
                    Semoga langkahmu selalu dimudahkan,
                    senyummu selalu terjaga,
                    dan hari-harimu dipenuhi kebahagiaan. 🤍
                </p>

                <div class="emoji">
                    🌷 ✨ 🦋 ✨ 🌷
                </div>
            </div>

            <p class="footer">
                Made with ❤️ just for you
            </p>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
